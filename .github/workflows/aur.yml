name: Update AUR

on:
  # After a green Build of main, never on the push itself: a commit that
  # fails to build must not reach the AUR.
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aur-update
  cancel-in-progress: false

jobs:
  aur:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute pkgver
        id: pkgver
        run: |
          pkgver="r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          echo "pkgver=$pkgver" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          {
            echo "Host aur.archlinux.org"
            echo "  IdentityFile ~/.ssh/aur"
            echo "  User aur"
          } >> ~/.ssh/config
          # The AUR is often briefly unreachable; retry before giving up,
          # and keep stderr so a failure says why instead of a bare exit 1.
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 aur.archlinux.org > /tmp/aur_hostkeys && [ -s /tmp/aur_hostkeys ]; then
              cat /tmp/aur_hostkeys >> ~/.ssh/known_hosts
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt failed" >&2
            sleep 20
          done
          exit 1
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/seraph-git.git aur-repo

      # .SRCINFO is the metadata the AUR and paru/yay actually read, and
      # several of its fields are derived from pkgver (provides=, among
      # others), so it is regenerated rather than patched line by line.
      # makepkg refuses to run as root; the builder uid is matched to the
      # bind-mounted directory so nothing in the workspace changes owner.
      - name: Sync package metadata
        run: |
          cp PKGBUILD aur-repo/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" aur-repo/PKGBUILD
          docker run --rm --volume "$PWD/aur-repo:/pkg" archlinux:base-devel \
            bash -c 'useradd --uid "$(stat --format=%u /pkg)" --create-home builder && cd /pkg && runuser -u builder -- makepkg --printsrcinfo' \
            > aur-repo/.SRCINFO
          grep -q "pkgver = $PKGVER" aur-repo/.SRCINFO
        env:
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}

      - name: Push to AUR
        run: |
          cd aur-repo
          git config user.name "Raphael"
          git config user.email "raphamzn@gmail.com"
          # The AUR serves an empty repo for a package that does not exist
          # yet, where HEAD is unborn on whatever init.defaultBranch happens
          # to be. Name the branch explicitly so the first publish lands.
          git checkout -B master
          git add PKGBUILD .SRCINFO
          # Staged, not worktree: on that first publish both files are
          # untracked, and `git diff` ignores untracked files -- it would
          # report "no changes" and skip the push that creates the package.
          if git diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git commit -m "bump pkgver to $PKGVER"
          git push origin master
        env:
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}
