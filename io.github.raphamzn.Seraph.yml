# Flatpak manifest for Seraph.
#
# Local build (run from repo root after committing your changes):
#
#   flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
#   flatpak-builder --force-clean --user --install \
#       build-flatpak io.github.raphamzn.Seraph.yml
#   flatpak run io.github.raphamzn.Seraph
#
# For local iteration without committing, swap the `seraph` module's source
# from `type: git` to `type: dir, path: .` (see comment below).
#
# For Flathub submission, this file is copied to a separate flathub repo
# and the `seraph` source must stay as `type: git` with a pinned tag/commit.

app-id: io.github.raphamzn.Seraph
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# fd and bat are Rust programs built from source (Flathub does not accept
# prebuilt binaries); the extension provides cargo and rustc.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: seraph

finish-args:
  # Display + input
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Network — required for the Remote Access feature (sftp/ftp/dav via gvfs)
  - --share=network

  # File manager scope: needs to read/write user files anywhere on the host.
  # Flathub reviewers grant this exception for general-purpose file managers
  # (Nautilus, Dolphin, Files use the same). `--filesystem=host` already
  # covers /mnt, /media, /run/media at their real paths through host bind
  # mounts, so no separate --filesystem entries are needed for those.
  - --filesystem=host
  # Access GVFS mounts (sftp:// etc.) exposed via the user runtime dir
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd

  # DBus
  # Mount/unmount removable devices (DeviceModel)
  - --system-talk-name=org.freedesktop.UDisks2
  # Required by `flatpak-spawn --host` so FileOperations can route
  # openFile / openFileWith / gio trash through the host, using the host's
  # default applications and the host's XDG trash instead of sandbox-local
  # copies. Same pattern as the Nautilus and Dolphin flatpaks.
  - --talk-name=org.freedesktop.Flatpak

  # Prefer Wayland, fall back to xcb
  - --env=QT_QPA_PLATFORM=wayland;xcb

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  # ── wl-clipboard ───────────────────────────────────────────────────────
  # ClipboardManager spawns wl-copy / wl-paste. Bundle them so the
  # clipboard works without depending on host tools.
  #
  # We deliberately skip `meson install` because upstream's install rules
  # try to write fish completions to /usr/share/fish/vendor_completions.d,
  # which is read-only inside the Flatpak build sandbox. Instead we run
  # meson + ninja ourselves and install only the two binaries we need.
  - name: wl-clipboard
    buildsystem: simple
    build-commands:
      - meson setup _build --prefix=/app --buildtype=release
      - ninja -C _build
      - install -Dm755 _build/src/wl-copy /app/bin/wl-copy
      - install -Dm755 _build/src/wl-paste /app/bin/wl-paste
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard.git
        tag: v2.2.1
        commit: 3eb912c274042cd5deed6b478b39908a12f37498

  # ── fd ─────────────────────────────────────────────────────────────────
  # Search backend. Optional — SearchService falls back to a Qt iterator
  # if `fd` / `fdfind` is not on PATH — but bundling it makes search fast.
  # Built offline from the crates listed in flatpak/fd-cargo-sources.json,
  # generated from the tag's Cargo.lock with flatpak-cargo-generator.py
  # (flatpak/flatpak-builder-tools). Regenerate it when bumping the tag.
  - name: fd
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/fd/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/fd /app/bin/fd
    sources:
      - type: git
        url: https://github.com/sharkdp/fd.git
        tag: v10.5.0
        commit: 4f81778774463bf414a184cbe6d5219ad2229646
      - flatpak/fd-cargo-sources.json

  # ── bat ────────────────────────────────────────────────────────────────
  # Optional syntax-highlighted text previews and markdown code blocks.
  # Same offline cargo build as fd; sources in flatpak/bat-cargo-sources.json.
  - name: bat
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/bat/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/bat /app/bin/bat
    sources:
      - type: git
        url: https://github.com/sharkdp/bat.git
        tag: v0.26.1
        commit: 979ba22628bc9d8171f2cffca2bd5c90c9fc0a9e
        # The syntax/theme submodules are only needed to regenerate
        # assets/*.bin, which the repo already ships; one of them points
        # at a commit its upstream no longer has, so cloning them fails.
        disable-submodules: true
      - flatpak/bat-cargo-sources.json

  # ── Seraph ─────────────────────────────────────────────────────────────
  - name: seraph
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DSERAPH_DATA_DIR=/app/share/seraph
      - -DBUILD_TESTS=OFF
      - -DSERAPH_ENABLE_PCH=OFF
      - -DSERAPH_ENABLE_UNITY_BUILD=OFF
    post-install:
      # Required by Flathub: every app must install its license file to
      # $FLATPAK_DEST/share/licenses/$FLATPAK_ID.
      - install -Dm644 LICENSE /app/share/licenses/io.github.raphamzn.Seraph/LICENSE
    sources:
      # ── RELEASE BUILD ──
      # scripts/release.sh bumps the tag. The copy submitted to Flathub
      # also pins `commit:`; it cannot live here because the release
      # commit contains this very file.
      - type: git
        url: https://github.com/raphamzn/seraph.git
        tag: v0.7.0

      # ── LOCAL ITERATION ──
      # For testing uncommitted changes locally, comment out the git
      # source above and uncomment the dir source below. Remember to
      # revert before tagging a new release.
      # - type: dir
      #   path: .
